<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="rs-hero-title rs-hero-desc">
  <title id="rs-hero-title">RedSignal — self-hosted Reddit lead monitor</title>
  <desc id="rs-hero-desc">RedSignal watches subreddits for keyword matches, filters noise with AI, and surfaces real leads in a live feed, next to a stylized feed showing three muted noise posts and one highlighted matched lead.</desc>

  <defs>
    <linearGradient id="rs-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0754a"/>
      <stop offset="1" stop-color="#c8401f"/>
    </linearGradient>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0a"/>
      <stop offset="1" stop-color="#111110"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#rs-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="25.5" fill="none" stroke="#232320"/>

  <!-- title block -->
  <g transform="translate(64 64)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <!-- brand mark: dot ring, echoes the app's own logo -->
    <rect x="0" y="0" width="42" height="42" rx="12" fill="url(#rs-mark)"/>
    <g fill="#fbe4d8">
      <circle cx="21" cy="10.5" r="1.7"/>
      <circle cx="29" cy="14" r="1.7"/>
      <circle cx="31.5" cy="21" r="1.7"/>
      <circle cx="29" cy="28" r="1.7"/>
      <circle cx="21" cy="31.5" r="1.7"/>
      <circle cx="13" cy="28" r="1.7"/>
      <circle cx="10.5" cy="21" r="1.7"/>
      <circle cx="13" cy="14" r="1.7"/>
    </g>

    <text x="58" y="31" font-size="34" font-weight="700" fill="#f6f5f2">RedSignal</text>

    <text x="1" y="76" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#8a8983" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">SELF-HOSTED REDDIT LEAD MONITOR</text>

    <text x="1" y="116" font-size="20" fill="#d8d7d1">Watches subreddits for keyword matches,</text>
    <text x="1" y="144" font-size="20" fill="#d8d7d1">filters the noise with AI, tells you when</text>
    <text x="1" y="172" font-size="20" fill="#d8d7d1">a real lead shows up.</text>

    <!-- metadata row -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#77766f">
      <text x="1" y="216">FastAPI</text>
      <circle cx="66" cy="212" r="2" fill="#4a4a44"/>
      <text x="78" y="216">PRAW</text>
      <circle cx="128" cy="212" r="2" fill="#4a4a44"/>
      <text x="140" y="216">SQLite</text>
      <circle cx="197" cy="212" r="2" fill="#4a4a44"/>
      <text x="209" y="216">MIT</text>
    </g>

    <!-- terminal chip -->
    <g transform="translate(0 240)">
      <rect x="0" y="0" width="248" height="38" rx="9" fill="#151513" stroke="#2a2a26"/>
      <text x="16" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#9fd9a8">$</text>
      <text x="32" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#c9c8c2">docker compose up -d</text>
    </g>
  </g>

  <!-- proof: noise -> signal feed -->
  <g transform="translate(716 62)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.4" fill="#77766f">LIVE FEED</text>

    <!-- noise rows -->
    <g>
      <rect x="0" y="16" width="420" height="46" rx="10" fill="#131311" stroke="#232320"/>
      <rect x="20" y="34" width="220" height="7" rx="3.5" fill="#33332e"/>
      <rect x="20" y="47" width="150" height="6" rx="3" fill="#26261f"/>
      <rect x="366" y="32" width="38" height="16" rx="4" fill="#1c1c18" stroke="#2e2e28"/>
    </g>
    <g>
      <rect x="0" y="70" width="420" height="46" rx="10" fill="#131311" stroke="#232320"/>
      <rect x="20" y="88" width="260" height="7" rx="3.5" fill="#33332e"/>
      <rect x="20" y="101" width="130" height="6" rx="3" fill="#26261f"/>
      <rect x="366" y="86" width="38" height="16" rx="4" fill="#1c1c18" stroke="#2e2e28"/>
    </g>
    <g>
      <rect x="0" y="124" width="420" height="46" rx="10" fill="#131311" stroke="#232320"/>
      <rect x="20" y="142" width="190" height="7" rx="3.5" fill="#33332e"/>
      <rect x="20" y="155" width="170" height="6" rx="3" fill="#26261f"/>
      <rect x="366" y="140" width="38" height="16" rx="4" fill="#1c1c18" stroke="#2e2e28"/>
    </g>

    <!-- the signal: matched lead -->
    <g>
      <rect x="0" y="178" width="420" height="54" rx="10" fill="#1c130d" stroke="#c8401f" stroke-width="1.4"/>
      <rect x="20" y="196" width="230" height="8" rx="4" fill="#f0754a"/>
      <rect x="20" y="211" width="270" height="7" rx="3.5" fill="#c9a996"/>
      <rect x="352" y="192" width="52" height="18" rx="5" fill="#f0754a"/>
      <text x="378" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#1c1108" text-anchor="middle">HIT</text>
    </g>

    <path d="M -18 205 L -4 205" stroke="#c8401f" stroke-width="1.6" fill="none"/>
    <text x="-24" y="209" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#c8401f" text-anchor="end">match</text>
  </g>
</svg>
